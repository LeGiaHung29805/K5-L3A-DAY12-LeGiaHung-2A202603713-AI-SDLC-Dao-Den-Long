name: Release verification
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run evidence
      - run: npm run soak -- --seed 7 --nights 10 --out soak-ci.json
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: phase-4-evidence-${{ matrix.os }}
          path: |
            docs/proof/phase-4/regression/
            soak-ci.json
